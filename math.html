<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฝึกหัดคณิตศาสตร์พื้นฐาน ม.1</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --border:#dbe3ef;
    --correct:#15803d;
    --wrong:#dc2626;
  }
  body.dark{
    --bg:#0f172a;
    --card:#172033;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --primary:#60a5fa;
    --primary2:#3b82f6;
    --border:#334155;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
  }
  .container{max-width:950px;margin:auto;padding:28px 18px 60px}
  header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb,#60a5fa);
    color:white;
    border-radius:22px;
    padding:30px;
    margin-bottom:22px;
    box-shadow:0 12px 30px #1e40af33;
  }
  header h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}
  header p{margin:5px 0;opacity:.92}
  .topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  button{
    border:0;
    border-radius:12px;
    padding:11px 16px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  #themeBtn{background:#ffffff22;color:white;border:1px solid #ffffff55}
  #submitBtn{background:var(--primary);color:white;width:100%;font-size:17px;margin-top:8px}
  #submitBtn:hover{background:var(--primary2)}
  .info{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px
  }
  .info div{
    background:var(--card);border:1px solid var(--border);border-radius:15px;
    padding:15px;text-align:center
  }
  .info strong{display:block;font-size:20px}
  .info span{color:var(--muted);font-size:13px}
  .question{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin:14px 0;
  }
  .qhead{display:flex;gap:12px;align-items:flex-start}
  .num{
    min-width:35px;height:35px;border-radius:10px;background:#dbeafe;color:#1d4ed8;
    display:grid;place-items:center;font-weight:800
  }
  body.dark .num{background:#1e3a5f;color:#93c5fd}
  .qtext{font-weight:700;font-size:17px;line-height:1.55}
  .options{display:grid;gap:9px;margin-top:15px}
  label{
    display:block;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    cursor:pointer;transition:.15s;
  }
  label:hover{border-color:var(--primary);background:#eff6ff22}
  input{margin-right:9px;accent-color:var(--primary)}
  .result{
    display:none;background:var(--card);border:2px solid var(--primary);
    border-radius:18px;padding:22px;margin:20px 0;font-size:18px;
  }
  .checkBtn{
    background:var(--primary);color:white;margin-top:12px;width:100%;
  }
  .feedback{
    display:none;margin-top:12px;padding:13px;border-radius:12px;font-weight:700;
  }
  .feedback.wrong{
    display:block;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;
  }
  .feedback.right{
    display:block;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;
  }
  body.dark .feedback.wrong{background:#451a1a;color:#fca5a5;border-color:#7f1d1d}
  body.dark .feedback.right{background:#052e16;color:#86efac;border-color:#166534}
  .hint{
    display:none;margin-top:8px;padding:11px;border-radius:10px;
    background:#fef3c7;color:#92400e;font-weight:500;
  }
  body.dark .hint{background:#422006;color:#fcd34d}
  .locked{opacity:.55}
  .locked input,.locked .checkBtn{pointer-events:none}
  .correct-answer{font-weight:800}
  .result strong{font-size:30px;color:var(--primary)}
  .explain{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#f1f5f9;color:#334155}
  body.dark .explain{background:#1e293b;color:#cbd5e1}
  .correct{border-color:var(--correct)!important}
  .wrong{border-color:var(--wrong)!important}
  .section{
    margin-top:30px;margin-bottom:8px;font-size:21px;font-weight:800;color:var(--primary)
  }
  @media(max-width:650px){
    .info{grid-template-columns:1fr}
    header{padding:23px}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="topbar">
      <div>
        <h1>แบบฝึกหัดคณิตศาสตร์พื้นฐาน ม.1</h1>
        <p>20 ข้อ • 4 ตัวเลือก • ระดับค่อนข้างท้าทาย</p>
        <p>ครอบคลุมจำนวนเต็ม เศษส่วน ทศนิยม เลขยกกำลัง และเอกนาม/พหุนาม</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <a href="index.html" style="background:#ffffff22;color:white;border:1px solid #ffffff55;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">🏠 หน้าหลัก</a>
        <button id="themeBtn" onclick="toggleTheme()">🌙 Dark mode</button>
      </div>
    </div>
  </header>

  <div class="info">
    <div><strong>20</strong><span>ข้อ</span></div>
    <div><strong>20</strong><span>คะแนน</span></div>
    <div><strong>4</strong><span>ตัวเลือกต่อข้อ</span></div>
  </div>

  <div id="quiz"></div>
  <button id="submitBtn" onclick="checkQuiz()">ตรวจคำตอบ</button>
  <div id="result" class="result"></div>
</div>

<script>
const questions = [
  {q:"จงหาค่า  -18 - (-7) + 4 × (-3)", a:["-23","-17","-5","17"], c:0, e:"ทำคูณก่อน: 4×(-3)=-12 จากนั้น -18-(-7)-12 = -18+7-12 = -23", h:"ทำการคูณก่อน แล้วค่อยจัดการเครื่องหมายลบกับจำนวนลบ"},
  {q:"ถ้า a = -6 และ b = 4 แล้ว 2a - 3b มีค่าเท่าใด", a:["-24","-12","0","24"], c:0, e:"แทนค่า: 2(-6)-3(4) = -12-12 = -24", h:"แทน a และ b ลงในสมการก่อน"},
  {q:"จำนวนใดมีค่ามากที่สุด", a:["-3 + (-8)","(-4) × 2","15 ÷ (-3)","-2 - (-10)"], c:3, e:"ได้ -11, -8, -5 และ 8 ตามลำดับ ดังนั้น 8 มากที่สุด", h:"คำนวณแต่ละตัวเลือกก่อน แล้วเปรียบเทียบจำนวน"},
  {q:"จงหาค่า  3/4 - 5/6 + 1/3", a:["1/4","5/12","7/12","11/12"], c:0, e:"ส่วนร่วมคือ 12: 9/12 - 10/12 + 4/12 = 3/12 = 1/4", h:"ทำส่วนให้เท่ากันเป็น 12 ก่อน"},
  {q:"ถ้า x = 2/3 แล้ว 9x/4 มีค่าเท่าใด", a:["1/2","3/2","2","9/2"], c:1, e:"(9/4)(2/3) = 18/12 = 3/2", h:"แทน x = 2/3 แล้วคูณเศษส่วน"},
  {q:"0.375 เขียนเป็นเศษส่วนอย่างต่ำได้เท่าใด", a:["3/8","5/16","7/20","15/32"], c:0, e:"0.375 = 375/1000 = 3/8", h:"เขียนเป็น 375/1000 แล้วตัดทอน"},
  {q:"ข้อใดมีค่าเท่ากับ 7/20", a:["0.25","0.30","0.35","0.45"], c:2, e:"7 ÷ 20 = 0.35", h:"แปลงเศษส่วนเป็นทศนิยมด้วยการหาร"},
  {q:"จงหาค่า  2^5 × 2^3 ÷ 2^4", a:["2^2","2^4","2^8","2^12"], c:1, e:"ฐานเดียวกัน: 2^(5+3-4) = 2^4", h:"คูณให้บวกเลขชี้กำลัง และหารให้ลบเลขชี้กำลัง"},
  {q:"จงเขียน (3^4)^2 ให้อยู่ในรูปเลขยกกำลังฐาน 3", a:["3^6","3^8","3^12","3^16"], c:1, e:"(a^m)^n = a^(mn) ดังนั้น 3^(4×2)=3^8", h:"เลขยกกำลังซ้อนกัน ให้คูณเลขชี้กำลัง"},
  {q:"ถ้า x ≠ 0 แล้ว x^7 ÷ x^3 มีค่าเท่ากับข้อใด", a:["x^10","x^4","x^3","x^2"], c:1, e:"การหารเลขยกกำลังฐานเดียวกันให้ลบเลขชี้กำลัง: x^(7-3)=x^4", h:"การหารฐานเดียวกัน: เลขชี้กำลังบน - เลขชี้กำลังล่าง"},
  {q:"0.0000048 เขียนในรูปสัญกรณ์วิทยาศาสตร์ได้อย่างไร", a:["4.8×10^-5","4.8×10^-6","48×10^-7","0.48×10^-5"], c:1, e:"เลื่อนจุดทศนิยม 6 ตำแหน่งไปทางขวา จึงเป็น 4.8×10^-6", h:"ต้องให้ตัวหน้าอยู่ระหว่าง 1 ถึง 10 แล้วนับจำนวนครั้งที่เลื่อนจุด"},
  {q:"(6.2×10^5) × (3×10^2) มีค่าในรูปสัญกรณ์วิทยาศาสตร์เท่าใด", a:["1.86×10^7","18.6×10^7","1.86×10^8","18.6×10^8"], c:2, e:"6.2×3=18.6 และ 10^5×10^2=10^7 ดังนั้น 18.6×10^7 = 1.86×10^8", h:"คูณตัวเลขด้านหน้า และบวกเลขชี้กำลัง จากนั้นจัดรูปให้ตัวหน้าอยู่ระหว่าง 1 ถึง 10"},
  {q:"(8.4×10^7) ÷ (2×10^3) มีค่าเท่าใด", a:["4.2×10^3","4.2×10^4","4.2×10^10","16.8×10^4"], c:1, e:"8.4÷2=4.2 และ 10^(7-3)=10^4", h:"หารตัวเลขด้านหน้า แล้วลบเลขชี้กำลัง"},
  {q:"เอกนาม -7x^3y^2 มีสัมประสิทธิ์และดีกรีรวมเท่าใด", a:["สัมประสิทธิ์ -7, ดีกรี 3","สัมประสิทธิ์ -7, ดีกรี 5","สัมประสิทธิ์ 7, ดีกรี 5","สัมประสิทธิ์ -5, ดีกรี 7"], c:1, e:"สัมประสิทธิ์คือ -7 และดีกรีรวมคือ 3+2=5", h:"ดีกรีรวม = ผลบวกเลขชี้กำลังของตัวแปรทั้งหมด"},
  {q:"จงหาผลลัพธ์ของ (4x^2 - 3x + 7) + (2x^2 + 5x - 9)", a:["6x^2+2x-2","6x^2-8x+16","2x^2+2x-2","6x^2+8x+16"], c:0, e:"รวมพจน์คล้าย: 4x²+2x²=6x², -3x+5x=2x, 7-9=-2", h:"จับคู่พจน์ที่มีตัวแปรและเลขชี้กำลังเหมือนกัน"},
  {q:"จงหาผลลัพธ์ของ (7a^2 - 4a + 1) - (3a^2 + 2a - 5)", a:["4a^2-2a+6","4a^2-6a+6","10a^2-2a-4","10a^2-6a+6"], c:1, e:"เปลี่ยนเครื่องหมายในวงเล็บหลัง: 7a²-4a+1-3a²-2a+5 = 4a²-6a+6", h:"ระวังเครื่องหมายลบหน้าวงเล็บ ต้องเปลี่ยนเครื่องหมายทุกพจน์ในวงเล็บ"},
  {q:"จงหาผลลัพธ์ของ 3x(2x^2 - 5x + 4)", a:["6x^3-15x^2+12x","6x^3-5x+4","5x^3-15x^2+12x","6x^2-15x+12"], c:0, e:"กระจาย 3x ไปทุกพจน์: 6x³ - 15x² + 12x", h:"คูณ 3x กับทุกพจน์ในวงเล็บ"},
  {q:"จงหาผลลัพธ์ของ (12x^3 - 8x^2 + 4x) ÷ 4x", a:["3x^2-2x+1","3x^2-2x+4","3x^3-2x^2+x","8x^2-4x+1"], c:0, e:"หารทุกพจน์ด้วย 4x: 3x² - 2x + 1", h:"แบ่งทุกพจน์ด้วย 4x ทีละพจน์"},
  {q:"ถ้า 2x(3x - 4) - x(2x + 5) = Ax^2 + Bx แล้ว A+B มีค่าเท่าใด", a:["-9","-7","-3","1"], c:0, e:"ได้ 6x²-8x-2x²-5x = 4x²-13x ดังนั้น A+B=4+(-13)=-9", h:"กระจายวงเล็บก่อน แล้วหา A และ B จากพจน์ x² และ x"},
  {q:"ข้อใดเป็นการจัดรูปที่ถูกต้องของ 5x^2 - 3x + 2 - 2x^2 + 7x - 9", a:["3x^2+4x-7","3x^2-10x+11","7x^2+4x-7","7x^2-10x-7"], c:0, e:"รวมพจน์คล้าย: (5-2)x² + (-3+7)x + (2-9) = 3x²+4x-7", h:"จัดกลุ่มพจน์ x², พจน์ x และจำนวนคงที่"}
];

let score = 0;
let attempts = Array(questions.length).fill(0);
let solved = Array(questions.length).fill(false);

function renderQuiz(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = questions.map((x,i)=>`
    <div class="question ${i > 0 ? "locked" : ""}" id="question${i}">
      <div class="qhead">
        <div class="num">${i+1}</div>
        <div class="qtext">${x.q}</div>
      </div>
      <div class="options">
        ${x.a.map((opt,j)=>`
          <label id="q${i}o${j}">
            <input type="radio" name="q${i}" value="${j}">
            ${String.fromCharCode(65+j)}. ${opt}
          </label>`).join("")}
      </div>
      <button class="checkBtn" onclick="checkQuestion(${i})">ตรวจคำตอบ</button>
      <div class="feedback" id="feedback${i}"></div>
      <div class="hint" id="hint${i}"></div>
    </div>
  `).join("");
}

function checkQuestion(i){
  if(solved[i]) return;

  const selected = document.querySelector(`input[name="q${i}"]:checked`);
  const feedback = document.getElementById(`feedback${i}`);
  const hint = document.getElementById(`hint${i}`);

  if(!selected){
    feedback.className = "feedback wrong";
    feedback.textContent = "กรุณาเลือกคำตอบก่อน";
    return;
  }

  attempts[i]++;
  const val = Number(selected.value);

  if(val === questions[i].c){
    solved[i] = true;
    score++;
    feedback.className = "feedback right";
    feedback.innerHTML = "ถูกต้อง! คำตอบของคุณถูกแล้ว<br><span class='correct-answer'>คำอธิบาย: ${questions[i].e}</span>";
    hint.style.display = "none";

    document.querySelectorAll(`#question${i} label`).forEach(l=>l.style.pointerEvents="none");
    document.querySelector(`#question${i} .checkBtn`).disabled = true;
    document.querySelector(`#question${i} .checkBtn`).textContent = "✓ ตอบถูกแล้ว";

    // Unlock the next question only after this one is correct.
    if(i + 1 < questions.length){
      const next = document.getElementById(`question${i+1}`);
      next.classList.remove("locked");
      next.scrollIntoView({behavior:"smooth",block:"center"});
    }

    if(score === questions.length){
      showFinalResult();
    }
  } else {
    feedback.className = "feedback wrong";
    feedback.textContent = "ยังไม่ถูก ลองใหม่อีกครั้ง";
    hint.style.display = "block";
    hint.textContent = "Hint: " + questions[i].h;

    // Do NOT reveal the correct answer.
    document.getElementById(`q${i}o${val}`).classList.add("wrong");
    setTimeout(()=>document.getElementById(`q${i}o${val}`).classList.remove("wrong"),900);
  }
}

function showFinalResult(){
  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `<strong>ครบทั้ง 20 ข้อแล้ว!</strong><br>คุณตอบถูกทุกข้อและผ่านแบบฝึกหัดนี้`;
  result.scrollIntoView({behavior:"smooth",block:"center"});
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  document.getElementById("themeBtn").textContent =
    document.body.classList.contains("dark") ? "☀️ Light mode" : "🌙 Dark mode";
}

renderQuiz();
</script>
</body>
</html>
